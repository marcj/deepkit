name: 'Setup job'
description: ''

inputs:
  node-version:
    description: 'Node.js version (current LTS)'
    default: '26'

runs:
  using: 'composite'
  steps:
    - name: Setup node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    # Node >= 25 no longer bundles corepack. Yarn version comes from package.json#packageManager.
    - name: Enable corepack
      shell: bash
      run: npm install -g corepack && corepack enable

    - name: Run yarn install
      shell: bash
      run: yarn install --immutable
      env:
        CI: 'true'
