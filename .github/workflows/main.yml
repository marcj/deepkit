name: CI

on:
  pull_request:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # same services as local development, see docker-compose.yml
      - name: Start test services
        run: docker compose up -d

      - name: Setup
        uses: ./.github/actions/setup
        timeout-minutes: 10

      - name: Build
        run: npm run tsc

      - name: Wait for test services
        run: docker compose up -d --wait

      - name: Test
        run: npm run test

      - name: Test service logs
        if: failure()
        run: docker compose ps -a && docker compose logs --tail=100
