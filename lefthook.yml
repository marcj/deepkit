# https://github.com/evilmartians/lefthook/blob/master/docs/configuration.md
commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}
pre-commit:
  piped: true
  commands:
#    github-actions:
#      glob: '*.{yaml,yml}'
#      root: '.github'
#      run: echo {staged_files} && actionlint
    prettier:
      glob: '[*.{json,yml,yaml,html,ts,tsx,js,jsx},!./package-lock.json]'
      priority: 1
      run: ./node_modules/.bin/prettier --write {staged_files} && git add {staged_files}
    # on master, the staged sources must have passed the complete `npm run test` (see scripts/test.js);
    # other branches commit freely, skipped when only the website changed
    test-certificate:
      priority: 2
      exclude:
        - 'website/**'
      run: node scripts/test.js check
pre-merge-commit:
  commands:
    # a merge commit into master needs tested sources too
    test-certificate:
      run: node scripts/test.js check
pre-push:
  commands:
    # a push to master (also after a fast-forward merge) needs tested sources
    test-certificate:
      use_stdin: true
      run: node scripts/test.js check-push
