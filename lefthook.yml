# https://github.com/evilmartians/lefthook/blob/master/docs/configuration.md
commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}
pre-commit:
  piped: true
  commands:
#    github-actions:
#      glob: '*.{yaml,yml}'
#      root: '.github'
#      run: echo {staged_files} && actionlint
    prettier:
      glob: '[*.{json,yml,yaml,html,ts,tsx,js,jsx},!./package-lock.json]'
      priority: 1
      run: ./node_modules/.bin/prettier --write {staged_files} && git add {staged_files}
    # the staged sources must have passed the complete `npm run test` (see scripts/test.js)
    test-certificate:
      priority: 2
      run: node scripts/test.js check
