approvedGitRepositories:
  - "**"

enableScripts: true

nodeLinker: node-modules

npmMinimalAgeGate: 10080

# our own packages: right after a release, builds that resolve them from npm (e.g. the website's Docker image)
# would otherwise fail for 7 days
npmPreapprovedPackages:
  - "@deepkit/*"

packageExtensions:
  "@types/node@22.13.1":
    dependencies:
      undici-types: 6.20.0
  "@types/ssh2-sftp-client@9.0.4":
    dependencies:
      "@types/node": 22.13.1
  "@types/ssh2@1.15.4":
    dependencies:
      "@types/node": 22.13.1

supportedArchitectures:
  cpu:
    - x64
    - arm64
  os:
    - linux
    - darwin

yarnPath: .yarn/releases/yarn-4.18.1.cjs
